<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zyra Portal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8fa4c0);
    --accent: var(--tg-theme-button-color, #6ab3f3);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
    overflow-x: hidden;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 40px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    font-size: 14px;
  }
  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #3a7bbf);
    display: grid;
    place-items: center;
    font-size: 14px;
    color: #fff;
  }
  .portal {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(106,179,243,0.55), transparent 60%),
      radial-gradient(circle at 50% 50%, rgba(106,179,243,0.25), transparent 80%);
    position: relative;
    animation: pulse 3s ease-in-out infinite;
    display: grid;
    place-items: center;
    margin-bottom: 34px;
  }
  .portal::before {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 2px solid rgba(106,179,243,0.5);
    animation: spin 6s linear infinite;
  }
  .portal::after {
    content: "ðŸŒ€";
    font-size: 54px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.04); filter: brightness(1.15); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label {
    color: var(--hint);
    font-size: 14px;
    margin: 0 0 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .vision {
    font-size: 42px;
    font-weight: 800;
    color: var(--accent);
    margin: 0 0 12px;
    word-break: break-word;
    min-height: 52px;
  }
  .instruction {
    color: var(--hint);
    font-size: 14px;
    max-width: 280px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="brand-mark">Z</div>
    <span>ZYRA PORTAL</span>
  </div>

  <div class="portal"></div>

  <p class="label">You see, in Heaven :</p>
  <div class="vision" id="vision-text">â€¦</div>
  <p class="instruction">Remember this word. Return to the chat and pick the right answer.</p>

<script>
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    if (tg) {
      try { tg.ready(); } catch (e) {}
      try { tg.expand(); } catch (e) {}
      try { tg.setHeaderColor("secondary_bg_color"); } catch (e) {}
      try { tg.setBackgroundColor("bg_color"); } catch (e) {}
    }

    var TEXTS = ["Zyra", "Zyro", "Zydro", "Zeta"];
    var SECRET = "z9K2wL5mP8xR3vN7tB1yF6jQ4hC0sD2g";

    function extractNonce() {
      try {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
          return String(tg.initDataUnsafe.start_param);
        }
      } catch (e) {}
      try {
        var params = new URLSearchParams(window.location.search);
        var v = params.get("tgWebAppStartParam") || params.get("startapp");
        if (v) return v;
      } catch (e) {}
      try {
        var hash = window.location.hash || "";
        if (hash.indexOf("tgWebAppStartParam=") !== -1) {
          return hash.split("tgWebAppStartParam=")[1].split("&")[0];
        }
      } catch (e) {}
      return "";
    }

    function hexToBigInt(hex) {
      var result = 0n;
      for (var i = 0; i < hex.length; i++) {
        result = (result << 4n) | BigInt(parseInt(hex[i], 16));
      }
      return result;
    }

    function visionFromNonce(nonce) {
      var enc = new TextEncoder();
      var data = enc.encode(nonce + ":" + SECRET);
      return crypto.subtle.digest("SHA-256", data).then(function (buf) {
        var bytes = new Uint8Array(buf);
        var hex = "";
        for (var i = 0; i < bytes.length; i++) {
          hex += ("00" + bytes[i].toString(16)).slice(-2);
        }
        var h = hexToBigInt(hex);
        var idx = Number(h % BigInt(TEXTS.length));
        return TEXTS[idx];
      });
    }

    var el = document.getElementById("vision-text");
    var nonce = extractNonce();

    if (!nonce) {
      el.textContent = "Unknown";
      return;
    }

    visionFromNonce(nonce)
      .then(function (vision) {
        el.textContent = vision;
      })
      .catch(function () {
        el.textContent = "Unknown";
      });
  })();
</script>
</body>
</html>
